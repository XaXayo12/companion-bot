name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  bot-build:
    name: Build bot — ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: '.exe'
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ''
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly
          rustup override set nightly
          rustup target add ${{ matrix.target }}
      - name: cargo build --release
        run: cargo build --release --target ${{ matrix.target }}
      - name: Rename binary
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/afk-companion-bot${{ matrix.ext }}"
          dst="afk-companion-bot-${{ matrix.target }}${{ matrix.ext }}"
          cp "$src" "$dst"
      - uses: actions/upload-artifact@v4
        with:
          name: bot-${{ matrix.target }}
          path: bot/afk-companion-bot-${{ matrix.target }}${{ matrix.ext }}

  mod-build:
    name: Build mod
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: mod/build/libs/*.jar

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [bot-build, mod-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
          body_path: CHANGELOG.md
          # Publish (not draft) so the release that triggered this run — created
          # via the API to make the tag — ends up public with the built binaries
          # attached, instead of being flipped back to a draft.
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
